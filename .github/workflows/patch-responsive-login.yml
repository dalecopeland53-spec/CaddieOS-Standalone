name: Patch responsive CaddieOS login

on:
  push:
    paths:
      - '.github/workflows/patch-responsive-login.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply responsive sizing fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('App.js')
          s = p.read_text()

          old = "function Welcome({player,setPlayer,email,setEmail,enter,ui}){return <ScrollView contentContainerStyle={[s.loginWrap,ui.compact&&s.loginWrapCompact]} showsVerticalScrollIndicator={false}><View style={s.loginSky}><BrandMark large/><Text style={s.loginBrand}>Caddie<Text style={s.loginBlue}>OS</Text></Text><Text style={s.loginTag}>YOUR CADDIE • YOUR GAME</Text><Text style={s.loginRule}>PLAY  •  PRACTICE  •  IMPROVE</Text></View><View style={s.loginPanel}><Text style={s.loginWelcome}>WELCOME TO CADDIEOS</Text><Text style={s.loginSub}>LET'S PLAY BETTER GOLF</Text><TextInput style={s.loginInput} value={player} onChangeText={setPlayer} placeholder=\"Your Name (e.g. Dale)\" placeholderTextColor=\"#A9B0B6\"/><TextInput style={s.loginInput} value={email} onChangeText={setEmail} autoCapitalize=\"none\" keyboardType=\"email-address\" placeholder=\"Email (optional)\" placeholderTextColor=\"#A9B0B6\"/><TouchableOpacity style={s.loginButton} onPress={enter}><Text style={s.loginButtonText}>ENTER CADDIEOS</Text><Text style={s.loginArrow}>›</Text></TouchableOpacity><Text style={s.loginMotto}>Smarter decisions. Better scores. More fun.</Text><Text style={s.loginScript}>Golf is a game for life</Text></View></ScrollView>}"
          new = "function Welcome({player,setPlayer,email,setEmail,enter,ui}){return <ScrollView style={s.loginScroll} contentContainerStyle={[s.loginWrap,ui.compact&&s.loginWrapCompact]} keyboardShouldPersistTaps=\"handled\" showsVerticalScrollIndicator={false}><View style={[s.loginSky,ui.compact&&s.loginSkyCompact]}><BrandMark large/><Text style={[s.loginBrand,ui.compact&&s.loginBrandCompact]}>Caddie<Text style={s.loginBlue}>OS</Text></Text><Text style={s.loginTag}>YOUR CADDIE • YOUR GAME</Text><Text style={[s.loginRule,ui.compact&&s.loginRuleCompact]}>PLAY  •  PRACTICE  •  IMPROVE</Text></View><View style={[s.loginPanel,ui.compact&&s.loginPanelCompact]}><Text style={[s.loginWelcome,ui.compact&&s.loginWelcomeCompact]}>WELCOME TO CADDIEOS</Text><Text style={[s.loginSub,ui.compact&&s.loginSubCompact]}>LET'S PLAY BETTER GOLF</Text><TextInput style={[s.loginInput,ui.compact&&s.loginInputCompact]} value={player} onChangeText={setPlayer} placeholder=\"Your Name (e.g. Dale)\" placeholderTextColor=\"#A9B0B6\"/><TextInput style={[s.loginInput,ui.compact&&s.loginInputCompact]} value={email} onChangeText={setEmail} autoCapitalize=\"none\" keyboardType=\"email-address\" placeholder=\"Email (optional)\" placeholderTextColor=\"#A9B0B6\"/><TouchableOpacity style={[s.loginButton,ui.compact&&s.loginButtonCompact]} onPress={enter}><Text style={[s.loginButtonText,ui.compact&&s.loginButtonTextCompact]}>ENTER CADDIEOS</Text><Text style={s.loginArrow}>›</Text></TouchableOpacity><Text style={[s.loginMotto,ui.compact&&s.loginMottoCompact]}>Smarter decisions. Better scores. More fun.</Text><Text style={[s.loginScript,ui.compact&&s.loginScriptCompact]}>Golf is a game for life</Text></View></ScrollView>}"
          if old not in s:
              raise SystemExit('Welcome component pattern not found')
          s = s.replace(old, new, 1)

          old_styles = "loginWrap:{flexGrow:1,backgroundColor:C.dark},loginWrapCompact:{paddingBottom:4},loginSky:{minHeight:350,alignItems:'center',justifyContent:'center',paddingTop:22,paddingHorizontal:20,backgroundColor:C.bg2},loginPanel:{padding:20,paddingTop:18,backgroundColor:C.dark},loginBrand:{fontSize:46,fontWeight:'900',color:C.gold2,marginTop:12},loginBlue:{color:'#159FE4'},loginTag:{fontSize:11,fontWeight:'900',letterSpacing:2.5,color:C.white,marginTop:1},loginRule:{fontSize:11,fontWeight:'800',letterSpacing:3,color:C.gold2,marginTop:20},loginWelcome:{fontSize:25,fontWeight:'900',textAlign:'center',color:C.gold2,letterSpacing:1},loginSub:{fontSize:12,fontWeight:'800',textAlign:'center',color:C.white,letterSpacing:3,marginTop:4,marginBottom:18},loginInput:{height:52,borderWidth:1.5,borderColor:C.gold,borderRadius:14,backgroundColor:'#0B2C43',paddingHorizontal:16,color:C.white,fontSize:15,marginBottom:11},loginButton:{height:58,borderRadius:29,backgroundColor:C.gold2,borderWidth:1,borderColor:'#FFE29A',flexDirection:'row',alignItems:'center',justifyContent:'center',marginTop:2},loginButtonText:{fontSize:18,fontWeight:'900',color:C.dark},loginArrow:{position:'absolute',right:20,fontSize:35,fontWeight:'500',color:C.dark},loginMotto:{fontSize:12,fontStyle:'italic',textAlign:'center',color:'#D9DDE0',letterSpacing:1.4,marginTop:18},loginScript:{fontSize:25,fontStyle:'italic',textAlign:'center',color:C.gold2,marginTop:20,marginBottom:12},"
          new_styles = "loginScroll:{flex:1,backgroundColor:C.dark},loginWrap:{flexGrow:1,minHeight:'100%',backgroundColor:C.dark},loginWrapCompact:{paddingBottom:8},loginSky:{flexGrow:1,flexShrink:1,minHeight:260,alignItems:'center',justifyContent:'center',paddingTop:16,paddingBottom:12,paddingHorizontal:20,backgroundColor:C.bg2},loginSkyCompact:{minHeight:230,paddingTop:10,paddingBottom:8},loginPanel:{flexGrow:1,flexShrink:0,paddingHorizontal:20,paddingTop:16,paddingBottom:18,backgroundColor:C.dark},loginPanelCompact:{paddingHorizontal:16,paddingTop:12,paddingBottom:12},loginBrand:{fontSize:46,fontWeight:'900',color:C.gold2,marginTop:10},loginBrandCompact:{fontSize:40,marginTop:5},loginBlue:{color:'#159FE4'},loginTag:{fontSize:11,fontWeight:'900',letterSpacing:2.5,color:C.white,marginTop:1},loginRule:{fontSize:11,fontWeight:'800',letterSpacing:3,color:C.gold2,marginTop:16},loginRuleCompact:{marginTop:10,fontSize:10,letterSpacing:2.4},loginWelcome:{fontSize:25,fontWeight:'900',textAlign:'center',color:C.gold2,letterSpacing:1},loginWelcomeCompact:{fontSize:22},loginSub:{fontSize:12,fontWeight:'800',textAlign:'center',color:C.white,letterSpacing:3,marginTop:4,marginBottom:15},loginSubCompact:{fontSize:11,marginBottom:11},loginInput:{height:50,borderWidth:1.5,borderColor:C.gold,borderRadius:14,backgroundColor:'#0B2C43',paddingHorizontal:16,color:C.white,fontSize:15,marginBottom:10},loginInputCompact:{height:46,marginBottom:8},loginButton:{height:54,borderRadius:27,backgroundColor:C.gold2,borderWidth:1,borderColor:'#FFE29A',flexDirection:'row',alignItems:'center',justifyContent:'center',marginTop:1},loginButtonCompact:{height:50,borderRadius:25},loginButtonText:{fontSize:18,fontWeight:'900',color:C.dark},loginButtonTextCompact:{fontSize:16},loginArrow:{position:'absolute',right:20,fontSize:35,fontWeight:'500',color:C.dark},loginMotto:{fontSize:12,fontStyle:'italic',textAlign:'center',color:'#D9DDE0',letterSpacing:1.4,marginTop:14},loginMottoCompact:{fontSize:11,marginTop:10},loginScript:{fontSize:25,fontStyle:'italic',textAlign:'center',color:C.gold2,marginTop:15,marginBottom:8},loginScriptCompact:{fontSize:21,marginTop:10,marginBottom:4},"
          if old_styles not in s:
              raise SystemExit('Login style pattern not found')
          s = s.replace(old_styles, new_styles, 1)
          p.write_text(s)
          PY
      - name: Commit fix
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes required.'
            exit 0
          fi
          git config user.name 'CaddieOS Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add App.js
          git commit -m 'Fix responsive login sizing and safe-area fit'
          git push
