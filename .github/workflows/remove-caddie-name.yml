name: Remove caddie name setting

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/remove-caddie-name.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove caddie name everywhere
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('App.js')
          s=p.read_text()
          s=s.replace(",[caddieName,setCaddieName]=useState('Pete')","")
          s=s.replace(";x.caddieName&&setCaddieName(x.caddieName)","")
          s=s.replace(",caddieName,handicap,practiceDistance",",handicap,practiceDistance")
          s=s.replace(",caddieName,handicap,practiceDistance]);",",handicap,practiceDistance]);")
          s=s.replace(" caddieName={caddieName}","")
          s=s.replace(" caddieName={caddieName} setCaddieName={setCaddieName}","")
          s=s.replace("function Caddie({result,distance,setDistance,wind,setWind,windDir,setWindDir,elev,setElev,lie,setLie,hole,caddieName,ask,listening,heard,caddieText,note,setNote,units})","function Caddie({result,distance,setDistance,wind,setWind,windDir,setWindDir,elev,setElev,lie,setLie,hole,ask,listening,heard,caddieText,note,setNote,units})")
          s=s.replace("{listening?'LISTENING…':`TAP AND ASK ${caddieName.toUpperCase()}`}","{listening?'LISTENING…':'CADDIE'}")
          s=s.replace("{caddieName.toUpperCase()} SAYS","CADDIE SAYS")
          s=s.replace("function More({open,units,caddieName,handicap})","function More({open,units,handicap})")
          s=s.replace("<View style={s.menuInfo}><Text style={s.menuInfoKey}>CADDIE NAME</Text><Text style={s.menuInfoVal}>{caddieName}</Text></View>","")
          s=s.replace("function Settings({units,setUnits,player,setPlayer,email,setEmail,caddieName,setCaddieName,handicap,setHandicap,logout})","function Settings({units,setUnits,player,setPlayer,email,setEmail,handicap,setHandicap,logout})")
          s=s.replace("<Text style={s.sectionLabel}>CADDIE NAME</Text><TextInput style={s.input} value={caddieName} onChangeText={setCaddieName}/>","")
          p.write_text(s)
          PY
      - name: Verify removal
        run: |
          ! grep -q "CADDIE NAME" App.js
          ! grep -q "caddieName" App.js
          grep -q "CADDIE SAYS" App.js
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add App.js
          git diff --cached --quiet && exit 0
          git commit -m "Remove caddie name setting"
          git push
