name: Fix App.js syntax

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-app-syntax.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair malformed startup effect
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('App.js')
          s=p.read_text()
          old=""" useEffect(()=>{(async()=>{try{const raw=await AsyncStorage.getItem(STORAGE);if(raw){const x=JSON.parse(raw);Object.entries({units:setUnits,player:setPlayer,email:setEmail,handicap:setHandicap,bag:setBag,course:setCourse,tee:setTee,targets:setTargets,scores:setScores,putts:setPutts,gir:setGir,fw:setFw,pen:setPen,notes:setNotes,roundLog:setRoundLog,practiceHistory:setPracticeHistory,routineSteps:setRoutineSteps,courseInfo:setCourseInfo}).forEach(([k,set])=>x[k]!==undefined&&set(x[k]))}}catch{};Tts.setDefaultLanguage('en-AU').catch(()=>{});Voice.onSpeechStart=()=>setListening(true);Voice.onSpeechEnd=()=>setListening(false);Voice.onSpeechError=()=>{setListening(false);setHeard('Microphone did not hear that. Tap and try again.')};Voice.onSpeechResults=e=>{const t=e.value?.[0]||'';setHeard(t?`Heard: ${t}`:'Nothing heard');if(t){parseSpeech(t,{setDistance,setWind,setWindDir,setElev,setLie});setPendingSpeak(true)}};return()=>{Voice.destroy().then(Voice.removeAllListeners).catch(()=>{})}},[]);"""
          new=""" useEffect(()=>{\n  let active=true;\n  (async()=>{\n   try{\n    const raw=await AsyncStorage.getItem(STORAGE);\n    if(active&&raw){\n     const x=JSON.parse(raw);\n     Object.entries({units:setUnits,player:setPlayer,email:setEmail,handicap:setHandicap,bag:setBag,course:setCourse,tee:setTee,targets:setTargets,scores:setScores,putts:setPutts,gir:setGir,fw:setFw,pen:setPen,notes:setNotes,roundLog:setRoundLog,practiceHistory:setPracticeHistory,routineSteps:setRoutineSteps,courseInfo:setCourseInfo}).forEach(([k,set])=>x[k]!==undefined&&set(x[k]));\n    }\n   }catch{}\n  })();\n  Tts.setDefaultLanguage('en-AU').catch(()=>{});\n  Voice.onSpeechStart=()=>setListening(true);\n  Voice.onSpeechEnd=()=>setListening(false);\n  Voice.onSpeechError=()=>{setListening(false);setHeard('Microphone did not hear that. Tap and try again.')};\n  Voice.onSpeechResults=e=>{const t=e.value?.[0]||'';setHeard(t?`Heard: ${t}`:'Nothing heard');if(t){parseSpeech(t,{setDistance,setWind,setWindDir,setElev,setLie});setPendingSpeak(true)}};\n  return()=>{active=false;Voice.destroy().then(Voice.removeAllListeners).catch(()=>{})};\n },[]);"""
          if old not in s:
              raise SystemExit('Expected malformed startup effect not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Verify repaired source
        run: |
          grep -q "let active=true" App.js
          grep -q "Voice.destroy().then" App.js
          ! grep -q "useEffect(()=>{(async()=>" App.js
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add App.js
          git commit -m "Fix App.js startup effect syntax"
          git push
