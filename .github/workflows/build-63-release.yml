name: CaddieOS Build 88 Release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build88:
    name: Build 88 APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - name: Create native shell
        run: npx --yes @react-native-community/cli@latest init CaddieOS --version 0.81.6 --skip-git-init --package-name com.dalecopeland.caddieos
      - name: Install native features
        working-directory: CaddieOS
        run: npm install --save @react-native-voice/voice@3.2.4 react-native-tts@4.1.1 @react-native-community/geolocation@3.4.0 @react-native-async-storage/async-storage@2.2.0 react-native-safe-area-context@5.6.2
      - name: Repair legacy Android libraries
        working-directory: CaddieOS
        run: |
          cat > node_modules/@react-native-voice/voice/android/build.gradle <<'GRADLE'
          apply plugin: 'com.android.library'
          android { namespace 'com.wenkesj.voice'; compileSdk 36; defaultConfig { minSdk 24; targetSdk 36 } }
          repositories { google(); mavenCentral() }
          dependencies { implementation 'com.facebook.react:react-android' }
          GRADLE
          cat > node_modules/react-native-tts/android/build.gradle <<'GRADLE'
          apply plugin: 'com.android.library'
          android { namespace 'net.no_mad.tts'; compileSdk 36; defaultConfig { minSdk 24; targetSdk 36 } }
          repositories { google(); mavenCentral() }
          dependencies { implementation 'com.facebook.react:react-android' }
          GRADLE
          python3 -c "from pathlib import Path; import re; [p.write_text(re.sub(r'\\s+package=\"[^\"]+\"','',p.read_text(),count=1)) for p in [Path('node_modules/@react-native-voice/voice/android/src/main/AndroidManifest.xml'),Path('node_modules/react-native-tts/android/src/main/AndroidManifest.xml')] if p.exists()]"
      - name: Install Build 88 source
        run: |
          cp App.js CaddieOS/App.js
          cp index.js CaddieOS/index.js
          cp compactWorkingPages.js CaddieOS/compactWorkingPages.js
          for n in 60 61 62 63 64 65 66 67 69 70 71 72 73 74 75 76 77 78 79 80 81 82 83 84 85 86 87 88; do python3 scripts/build${n}_patch.py; done
      - name: Validate Build 88 source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          a=Path('CaddieOS/App.js').read_text();g=Path('CaddieOS/android/app/build.gradle').read_text();compact=''.join(a.split())
          req=['BUILD88_GPS_STREAM_TARGET_FIX','Geolocation.getCurrentPosition(setGPSPoint','Geolocation.watchPosition(setGPSPoint','[realCourse]);','gpsLat=Number(gps?.lat)','[realCourse,!!gps]','BUILD87_NEARBY_COURSE_LOCK','apiHole?.raw||apiHole||{}']
          miss=[x for x in req if ''.join(x.split()) not in compact]
          if '[realCourse,gpsLive]' in compact:miss.append('GPS stop/restart regression')
          if 'versionCode 88' not in g:miss.append('versionCode 88')
          if 'versionName "1.0.88"' not in g:miss.append('versionName 1.0.88')
          if miss:raise SystemExit('Build 88 validation failed: '+', '.join(miss))
          print('Build 88 GPS stream, stop control and real target fallback validated')
          PY
      - name: Build release APK
        working-directory: CaddieOS/android
        run: chmod +x gradlew && ./gradlew assembleRelease --no-daemon
      - name: Collect APK
        run: mkdir -p output && cp CaddieOS/android/app/build/outputs/apk/release/app-release.apk output/CaddieOS-Build-88.apk
      - uses: actions/upload-artifact@v4
        with:
          name: CaddieOS-Build-88
          path: output/CaddieOS-Build-88.apk
          if-no-files-found: error
          retention-days: 14
