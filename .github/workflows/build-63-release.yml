name: CaddieOS Build 78 Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build78:
    name: Build 78 APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Create native shell
        run: npx --yes @react-native-community/cli@latest init CaddieOS --version 0.81.6 --skip-git-init --package-name com.dalecopeland.caddieos
      - name: Install native features
        working-directory: CaddieOS
        run: npm install --save @react-native-voice/voice@3.2.4 react-native-tts@4.1.1 @react-native-community/geolocation@3.4.0 @react-native-async-storage/async-storage@2.2.0 react-native-safe-area-context@5.6.2
      - name: Repair legacy Android libraries
        working-directory: CaddieOS
        run: |
          cat > node_modules/@react-native-voice/voice/android/build.gradle <<'GRADLE'
          apply plugin: 'com.android.library'
          android { namespace 'com.wenkesj.voice'; compileSdk 36; defaultConfig { minSdk 24; targetSdk 36 } }
          repositories { google(); mavenCentral() }
          dependencies { implementation 'com.facebook.react:react-android' }
          GRADLE
          cat > node_modules/react-native-tts/android/build.gradle <<'GRADLE'
          apply plugin: 'com.android.library'
          android { namespace 'net.no_mad.tts'; compileSdk 36; defaultConfig { minSdk 24; targetSdk 36 } }
          repositories { google(); mavenCentral() }
          dependencies { implementation 'com.facebook.react:react-android' }
          GRADLE
          python3 -c "from pathlib import Path; import re; [p.write_text(re.sub(r'\\s+package=\"[^\"]+\"','',p.read_text(),count=1)) for p in [Path('node_modules/@react-native-voice/voice/android/src/main/AndroidManifest.xml'),Path('node_modules/react-native-tts/android/src/main/AndroidManifest.xml')] if p.exists()]"
      - name: Install Build 78 source
        run: |
          cp App.js CaddieOS/App.js
          cp index.js CaddieOS/index.js
          cp compactWorkingPages.js CaddieOS/compactWorkingPages.js
          python3 scripts/build60_patch.py
          python3 scripts/build61_patch.py
          python3 scripts/build62_patch.py
          python3 scripts/build63_patch.py
          python3 scripts/build64_patch.py
          python3 scripts/build65_patch.py
          python3 scripts/build66_patch.py
          python3 scripts/build67_patch.py
          python3 scripts/build69_patch.py
          python3 scripts/build70_patch.py
          python3 scripts/build71_patch.py
          python3 scripts/build72_patch.py
          python3 scripts/build73_patch.py
          python3 scripts/build74_patch.py
          python3 scripts/build75_patch.py
          python3 scripts/build76_patch.py
          python3 scripts/build77_patch.py
          python3 scripts/build78_patch.py
      - name: Validate Build 78 source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          app=Path('CaddieOS/App.js').read_text(); gradle=Path('CaddieOS/android/app/build.gradle').read_text(); manifest=Path('CaddieOS/android/app/src/main/AndroidManifest.xml').read_text()
          required=['BUILD78_REAL_COURSE_CADDIE','BUILD77_REAL_COURSE_API','BUILD76_HOLE_GRAPHICS','buildRealCourseAdvice','openGolfHoleContext','OPENGOLF_API','android.permission.ACCESS_FINE_LOCATION','android.permission.RECORD_AUDIO']
          missing=[x for x in required if x not in app and x not in manifest]
          if 'versionCode 78' not in gradle: missing.append('versionCode 78')
          if 'versionName "1.0.78"' not in gradle: missing.append('versionName 1.0.78')
          if missing: raise SystemExit('Build 78 validation failed: '+', '.join(missing))
          print('Build 78 validation passed: OpenGolf course data linked to caddie advice')
          PY
      - name: Build release APK
        working-directory: CaddieOS/android
        run: chmod +x gradlew && ./gradlew assembleRelease --no-daemon
      - name: Collect APK
        run: mkdir -p output && cp CaddieOS/android/app/build/outputs/apk/release/app-release.apk output/CaddieOS-Build-78.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CaddieOS-Build-78
          path: output/CaddieOS-Build-78.apk
          if-no-files-found: error
          retention-days: 14
