name: CaddieOS Build 104

"on":
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build CaddieOS APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout clean source
        uses: actions/checkout@v4
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Create React Native shell
        run: npx --yes @react-native-community/cli@latest init CaddieOS --version 0.81.6 --skip-git-init --package-name com.dalecopeland.caddieos
      - name: Install native features
        working-directory: CaddieOS
        run: npm install --save @react-native-voice/voice@3.2.4 react-native-tts@4.1.1 @react-native-community/geolocation@3.4.0 @react-native-async-storage/async-storage@2.2.0 react-native-safe-area-context@5.6.2
      - name: Repair legacy native libraries
        working-directory: CaddieOS
        run: |
          cat > node_modules/@react-native-voice/voice/android/build.gradle <<'GRADLE'
          apply plugin: 'com.android.library'
          android { namespace 'com.wenkesj.voice'; compileSdk 36; defaultConfig { minSdk 24; targetSdk 36 } }
          repositories { google(); mavenCentral() }
          dependencies { implementation 'com.facebook.react:react-android' }
          GRADLE
          cat > node_modules/react-native-tts/android/build.gradle <<'GRADLE'
          apply plugin: 'com.android.library'
          android { namespace 'net.no_mad.tts'; compileSdk 36; defaultConfig { minSdk 24; targetSdk 36 } }
          repositories { google(); mavenCentral() }
          dependencies { implementation 'com.facebook.react:react-android' }
          GRADLE
          python3 -c "from pathlib import Path; import re; [p.write_text(re.sub(r'\\s+package=\"[^\"]+\"','',p.read_text(),count=1)) for p in [Path('node_modules/@react-native-voice/voice/android/src/main/AndroidManifest.xml'),Path('node_modules/react-native-tts/android/src/main/AndroidManifest.xml')] if p.exists()]"
      - name: Install complete CaddieOS source
        run: |
          cp App.js CaddieOS/App.js
          cp index.js CaddieOS/index.js
          cp compactWorkingPages.js CaddieOS/compactWorkingPages.js
      - name: Configure Android release
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          manifest = Path('CaddieOS/android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text()
          for permission in ['android.permission.RECORD_AUDIO','android.permission.ACCESS_FINE_LOCATION','android.permission.ACCESS_COARSE_LOCATION','android.permission.INTERNET']:
              line = f'<uses-permission android:name="{permission}" />'
              if line not in text:
                  position = text.find('>') + 1
                  text = text[:position] + '\n    ' + line + text[position:]
          manifest.write_text(text)
          gradle = Path('CaddieOS/android/app/build.gradle')
          text = gradle.read_text()
          text = re.sub(r'versionCode\s+\d+', 'versionCode 104', text, count=1)
          text = re.sub(r'versionName\s+"[^"]+"', 'versionName "1.0.104"', text, count=1)
          gradle.write_text(text)
          PY
      - name: Validate clean source
        run: |
          test -s CaddieOS/App.js
          grep -q "const PARS = \[4,4,3,5" CaddieOS/App.js
          grep -q "Voice.onSpeechResults" CaddieOS/App.js
          test -s CaddieOS/compactWorkingPages.js
          grep -q "const styles=StyleSheet.create" CaddieOS/App.js
          grep -q "versionCode 104" CaddieOS/android/app/build.gradle
      - name: Build release APK
        working-directory: CaddieOS/android
        run: chmod +x gradlew && ./gradlew assembleRelease --no-daemon
      - name: Collect APK
        run: mkdir -p output && cp CaddieOS/android/app/build/outputs/apk/release/app-release.apk output/CaddieOS-Build-104.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CaddieOS-Build-104
          path: output/CaddieOS-Build-104.apk
          if-no-files-found: error
          retention-days: 14
