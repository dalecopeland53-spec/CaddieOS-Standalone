name: CaddieOS Clean Master Release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: Build CaddieOS APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Create clean native shell
        run: npx --yes @react-native-community/cli@latest init CaddieOS --version 0.81.6 --skip-git-init --package-name com.dalecopeland.caddieos
      - name: Install native features
        working-directory: CaddieOS
        run: npm install --save @react-native-voice/voice@3.2.4 react-native-tts@4.1.1 @react-native-community/geolocation@3.4.0 @react-native-async-storage/async-storage@2.2.0 react-native-safe-area-context@5.6.2
      - name: Repair legacy Android libraries
        working-directory: CaddieOS
        run: |
          cat > node_modules/@react-native-voice/voice/android/build.gradle <<'GRADLE'
          apply plugin: 'com.android.library'
          android { namespace 'com.wenkesj.voice'; compileSdk 36; defaultConfig { minSdk 24; targetSdk 36 } }
          repositories { google(); mavenCentral() }
          dependencies { implementation 'com.facebook.react:react-android' }
          GRADLE
          cat > node_modules/react-native-tts/android/build.gradle <<'GRADLE'
          apply plugin: 'com.android.library'
          android { namespace 'net.no_mad.tts'; compileSdk 36; defaultConfig { minSdk 24; targetSdk 36 } }
          repositories { google(); mavenCentral() }
          dependencies { implementation 'com.facebook.react:react-android' }
          GRADLE
          python3 -c "from pathlib import Path; import re; [p.write_text(re.sub(r'\\s+package=\"[^\"]+\"','',p.read_text(),count=1)) for p in [Path('node_modules/@react-native-voice/voice/android/src/main/AndroidManifest.xml'),Path('node_modules/react-native-tts/android/src/main/AndroidManifest.xml')] if p.exists()]"
      - name: Install current CaddieOS master source
        run: |
          cp App.js CaddieOS/App.js
          cp index.js CaddieOS/index.js
          if [ -f compactWorkingPages.js ]; then cp compactWorkingPages.js CaddieOS/compactWorkingPages.js; fi
      - name: Configure Android permissions and release version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          manifest=Path('CaddieOS/android/app/src/main/AndroidManifest.xml')
          s=manifest.read_text()
          perms=['android.permission.RECORD_AUDIO','android.permission.ACCESS_FINE_LOCATION','android.permission.ACCESS_COARSE_LOCATION','android.permission.INTERNET']
          for perm in perms:
              line=f'<uses-permission android:name="{perm}" />'
              if line not in s:
                  s=s.replace('<manifest', '<manifest', 1)
                  pos=s.find('>')+1
                  s=s[:pos]+'\n    '+line+s[pos:]
          manifest.write_text(s)
          g=Path('CaddieOS/android/app/build.gradle')
          t=g.read_text()
          t=re.sub(r'versionCode\s+\d+','versionCode 95',t,count=1)
          t=re.sub(r'versionName\s+"[^"]+"','versionName "1.0.95"',t,count=1)
          g.write_text(t)
          PY
      - name: Validate source
        run: |
          test -s CaddieOS/App.js
          test -s CaddieOS/index.js
          grep -q "versionCode 95" CaddieOS/android/app/build.gradle
          grep -q "RECORD_AUDIO" CaddieOS/android/app/src/main/AndroidManifest.xml
          grep -q "ACCESS_FINE_LOCATION" CaddieOS/android/app/src/main/AndroidManifest.xml
          echo "Clean CaddieOS master source ready"
      - name: Build release APK
        working-directory: CaddieOS/android
        run: chmod +x gradlew && ./gradlew assembleRelease --no-daemon
      - name: Collect APK
        run: mkdir -p output && cp CaddieOS/android/app/build/outputs/apk/release/app-release.apk output/CaddieOS-Build-95.apk
      - uses: actions/upload-artifact@v4
        with:
          name: CaddieOS-Build-95
          path: output/CaddieOS-Build-95.apk
          if-no-files-found: error
          retention-days: 14
