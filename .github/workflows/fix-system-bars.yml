name: Fix CaddieOS system bars
on:
  push:
    paths:
      - '.github/workflows/fix-system-bars.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Android safe-area shell fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('App.js')
          s=p.read_text()
          replacements=[
            ("safe:{flex:1,backgroundColor:C.bg}", "safe:{flex:1,backgroundColor:C.bg,paddingTop:Platform.OS==='android'?(StatusBar.currentHeight||24):0}"),
            ("headerBrand:{flexDirection:'row',alignItems:'center'}", "headerBrand:{flexDirection:'row',alignItems:'center',flexShrink:1,minWidth:0}"),
            ("headerGold:{fontSize:9,fontWeight:'900',letterSpacing:1.5,color:C.gold2}", "headerGold:{fontSize:9,fontWeight:'900',letterSpacing:1.2,color:C.gold2,marginLeft:6,flexShrink:0}"),
            ("paddingBottom:Platform.OS==='android'?16:7", "paddingBottom:Platform.OS==='android'?38:7"),
            ("paddingBottom:Platform.OS==='android'?14:5", "paddingBottom:Platform.OS==='android'?36:5")
          ]
          for old,new in replacements:
              if old not in s:
                  raise SystemExit('Missing expected source: '+old)
              s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Commit safe-area fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add App.js
          git commit -m "Fix Android status and navigation bar overlap"
          git push
