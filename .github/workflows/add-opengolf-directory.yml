name: Add OpenGolfAPI Course Directory

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch CaddieOS course directory
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path('App.js')
          t=p.read_text()
          t=t.replace("{page==='COURSE'&&<Course {...{course,setCourse,tee,setTee,hole,setHole,gps,getGPS,markTarget,currentTarget,open}}/>}","{page==='COURSE'&&<Course {...{course,setCourse,tee,setTee,hole,setHole,gps,getGPS,markTarget,currentTarget,open,setTargets}}/>}")

          course=r'''function Course({course,setCourse,tee,setTee,hole,setHole,gps,getGPS,markTarget,currentTarget,open,setTargets}){
 const[q,setQ]=useState(''),[results,setResults]=useState([]),[searching,setSearching]=useState(false),[loadingCourse,setLoadingCourse]=useState(false),[source,setSource]=useState('MANUAL');
 const card={backgroundColor:C.panel,borderRadius:14,padding:12,marginBottom:10,borderWidth:1,borderColor:C.line};
 const label={fontSize:11,fontWeight:'900',letterSpacing:1.2,color:C.muted,marginBottom:5};
 const input={backgroundColor:C.white,borderWidth:1,borderColor:C.line,borderRadius:10,paddingHorizontal:11,paddingVertical:9,color:C.text,fontWeight:'700'};
 const btn={backgroundColor:C.navy,borderRadius:10,paddingVertical:11,paddingHorizontal:12,alignItems:'center',justifyContent:'center'};
 const btnText={color:C.white,fontWeight:'900',letterSpacing:.6,fontSize:12};
 const search=async()=>{const term=q.trim();if(term.length<2)return Alert.alert('Course search','Type at least two letters of the course name.');setSearching(true);try{const r=await fetch(`https://api.opengolfapi.org/v1/courses/search?q=${encodeURIComponent(term)}&limit=12`);if(!r.ok)throw new Error(String(r.status));const j=await r.json();const a=Array.isArray(j)?j:(j.courses||j.results||j.data||[]);setResults(Array.isArray(a)?a:[]);if(!a.length)Alert.alert('Course search','No matching course found. You can still enter and map it manually.')}catch(e){Alert.alert('Course search','Course directory is unavailable right now. Manual course setup still works offline.')}finally{setSearching(false)}};
 const pt=v=>{if(!v||typeof v!=='object')return null;const lat=Number(v.lat??v.latitude??v.y),lon=Number(v.lon??v.lng??v.longitude??v.x);return Number.isFinite(lat)&&Number.isFinite(lon)?{lat,lon}:null};
 const holeTargets=h=>{const g=h?.green||h?.coordinates||{};return{front:pt(h?.front||h?.green_front||h?.greenFront||g?.front),center:pt(h?.center||h?.green_center||h?.greenCenter||h?.pin||g?.center||g?.green),back:pt(h?.back||h?.green_back||h?.greenBack||g?.back)}};
 const choose=async item=>{const id=item?.id??item?.course_id??item?.courseId;if(!id)return;setLoadingCourse(true);try{const [dr,hr,tr]=await Promise.all([fetch(`https://api.opengolfapi.org/v1/courses/${id}`),fetch(`https://api.opengolfapi.org/v1/courses/${id}/holes`),fetch(`https://api.opengolfapi.org/v1/courses/${id}/tees`)]);const d=dr.ok?await dr.json():item,hj=hr.ok?await hr.json():[],tj=tr.ok?await tr.json():[];const name=d?.name||d?.course_name||item?.name||item?.course_name||'Golf Course';setCourse(name);const hs=Array.isArray(hj)?hj:(hj.holes||hj.data||[]);if(Array.isArray(hs)&&hs.length){const mapped=Array.from({length:18},(_,i)=>holeTargets(hs[i]||{}));if(mapped.some(x=>x.front||x.center||x.back))setTargets(mapped)}const tees=Array.isArray(tj)?tj:(tj.tees||tj.data||[]);if(Array.isArray(tees)&&tees.length){const preferred=tees.find(x=>String(x.color||x.name||'').toLowerCase()===String(tee).toLowerCase())||tees[0];const tc=String(preferred?.color||preferred?.name||'');const match=TEES.find(x=>x.toLowerCase()===tc.toLowerCase());if(match)setTee(match)}setSource('OPENGOLFAPI');setResults([]);setQ('');Alert.alert('Course loaded',`${name} is saved locally. Any missing GPS points can still be mapped manually.`)}catch(e){Alert.alert('Course import','Could not import that course. Manual course setup remains available.')}finally{setLoadingCourse(false)}};
 return <View>
  <Text style={{color:C.gold,fontSize:11,fontWeight:'900',letterSpacing:1.6,marginBottom:3}}>COURSE</Text><Text style={{color:C.white,fontSize:24,fontWeight:'900',marginBottom:10}}>Course Setup</Text>
  <View style={card}><Text style={label}>COURSE DIRECTORY</Text><View style={{flexDirection:'row',gap:7}}><TextInput value={q} onChangeText={setQ} onSubmitEditing={search} placeholder="Search course name" placeholderTextColor={C.muted} style={[input,{flex:1}]}/><TouchableOpacity onPress={search} disabled={searching} style={[btn,{minWidth:82,opacity:searching?.65:1}]}><Text style={btnText}>{searching?'SEARCHING':'SEARCH'}</Text></TouchableOpacity></View><Text style={{color:C.muted,fontSize:11,marginTop:6}}>OpenGolfAPI directory · selected courses are saved locally · manual mapping remains available.</Text>{results.map((x,i)=>{const name=x?.name||x?.course_name||'Golf Course',place=[x?.city,x?.state,x?.country].filter(Boolean).join(', ');return <TouchableOpacity key={String(x?.id??i)} onPress={()=>choose(x)} style={{paddingVertical:10,borderTopWidth:i||0?1:0,borderTopColor:C.line}}><Text style={{color:C.text,fontWeight:'900'}}>{name}</Text>{!!place&&<Text style={{color:C.muted,fontSize:12,marginTop:2}}>{place}</Text>}</TouchableOpacity>})}{loadingCourse&&<Text style={{color:C.navy,fontWeight:'900',marginTop:8}}>IMPORTING COURSE…</Text>}</View>
  <View style={card}><Text style={label}>COURSE NAME</Text><TextInput value={course} onChangeText={v=>{setCourse(v);setSource('MANUAL')}} placeholder="Enter course manually" placeholderTextColor={C.muted} style={input}/><Text style={[label,{marginTop:10}]}>TEE</Text><View style={{flexDirection:'row',flexWrap:'wrap',gap:6}}>{TEES.map(x=><TouchableOpacity key={x} onPress={()=>setTee(x)} style={{paddingVertical:8,paddingHorizontal:11,borderRadius:9,backgroundColor:tee===x?C.gold:C.panel2,borderWidth:1,borderColor:tee===x?C.gold:C.line}}><Text style={{fontWeight:'900',color:C.text}}>{x}</Text></TouchableOpacity>)}</View><Text style={{color:C.muted,fontSize:11,marginTop:8}}>Source: {source==='OPENGOLFAPI'?'OpenGolfAPI + local save':'Manual / local'}</Text></View>
  <View style={card}><Text style={label}>COURSE MAPPER</Text><View style={{flexDirection:'row',alignItems:'center',justifyContent:'space-between',marginBottom:9}}><TouchableOpacity onPress={()=>setHole(String(Math.max(1,n(hole)-1)))} style={[btn,{paddingHorizontal:16}]}><Text style={btnText}>−</Text></TouchableOpacity><Text style={{color:C.text,fontWeight:'900',fontSize:18}}>HOLE {hole}</Text><TouchableOpacity onPress={()=>setHole(String(Math.min(18,n(hole)+1)))} style={[btn,{paddingHorizontal:16}]}><Text style={btnText}>+</Text></TouchableOpacity></View><TouchableOpacity onPress={getGPS} style={[btn,{backgroundColor:C.gold}]}><Text style={[btnText,{color:C.text}]}>GET GPS POSITION</Text></TouchableOpacity><Text style={{color:C.muted,fontSize:11,textAlign:'center',marginVertical:7}}>{gps?`${gps.lat}, ${gps.lon} · ±${gps.acc}m`:'GPS not captured yet'}</Text><View style={{flexDirection:'row',gap:6}}>{['front','center','back'].map(k=><TouchableOpacity key={k} onPress={()=>markTarget(k)} style={[btn,{flex:1,paddingHorizontal:4}]}><Text style={[btnText,{fontSize:10}]}>{k.toUpperCase()}</Text></TouchableOpacity>)}</View><Text style={{color:C.muted,fontSize:11,marginTop:8}}>Hole {hole}: {currentTarget?.front?'F ✓':'F —'} · {currentTarget?.center?'C ✓':'C —'} · {currentTarget?.back?'B ✓':'B —'}</Text></View>
  <TouchableOpacity onPress={()=>open('COURSEINFO')} style={[btn,{backgroundColor:C.gold,marginBottom:8}]}><Text style={[btnText,{color:C.text}]}>COURSE INFORMATION</Text></TouchableOpacity>
 </View>
}'''
          pattern=r"function Course\([^\n]*\)\{.*?\n\}\nfunction More"
          nt,n=re.subn(pattern,course+'\nfunction More',t,count=1,flags=re.S)
          if n!=1:
              raise SystemExit('Could not locate Course component for replacement')
          if 'api.opengolfapi.org/v1/courses/search' not in nt or 'setTargets' not in nt:
              raise SystemExit('OpenGolfAPI integration verification failed')
          p.write_text(nt)
          PY
      - name: Validate integration
        run: |
          grep -q "api.opengolfapi.org/v1/courses/search" App.js
          grep -q "selected courses are saved locally" App.js
          grep -q "setTargets" App.js
      - name: Commit course directory
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add App.js
          git commit -m "Integrate OpenGolfAPI course directory" || exit 0
          git push
