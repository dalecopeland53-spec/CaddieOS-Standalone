name: Fix OpenGolfAPI Integration Runner

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-opengolf-runner.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix Course component matcher
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/apply-opengolf-directory-now.yml')
          t=p.read_text()
          old=r'function Course\\([^\\n]*\\)\\{.*?\\n\\}\\nfunction More'
          new=r'function Course\\([^)]*\\)\\{.*?\\nfunction More'
          if old not in t:
              raise SystemExit('Old matcher not found')
          p.write_text(t.replace(old,new))
          PY
      - name: Commit runner fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/apply-opengolf-directory-now.yml
          git commit -m "Fix OpenGolfAPI Course component matcher"
          git push
