name: CaddieOS Build 62 Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build62:
    name: Build 62 APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Create native shell
        run: npx --yes @react-native-community/cli@latest init CaddieOS --version 0.81.6 --skip-git-init --package-name com.dalecopeland.caddieos
      - name: Install native features
        working-directory: CaddieOS
        run: npm install --save @react-native-voice/voice@3.2.4 react-native-tts@4.1.1 @react-native-community/geolocation@3.4.0 @react-native-async-storage/async-storage@2.2.0 react-native-safe-area-context@5.6.2
      - name: Repair legacy Android libraries
        working-directory: CaddieOS
        run: |
          cat > node_modules/@react-native-voice/voice/android/build.gradle <<'GRADLE'
          apply plugin: 'com.android.library'
          android { namespace 'com.wenkesj.voice'; compileSdk 36; defaultConfig { minSdk 24; targetSdk 36 } }
          repositories { google(); mavenCentral() }
          dependencies { implementation 'com.facebook.react:react-android' }
          GRADLE
          cat > node_modules/react-native-tts/android/build.gradle <<'GRADLE'
          apply plugin: 'com.android.library'
          android { namespace 'net.no_mad.tts'; compileSdk 36; defaultConfig { minSdk 24; targetSdk 36 } }
          repositories { google(); mavenCentral() }
          dependencies { implementation 'com.facebook.react:react-android' }
          GRADLE
          python3 -c "from pathlib import Path; import re; [p.write_text(re.sub(r'\\s+package=\"[^\"]+\"','',p.read_text(),count=1)) for p in [Path('node_modules/@react-native-voice/voice/android/src/main/AndroidManifest.xml'),Path('node_modules/react-native-tts/android/src/main/AndroidManifest.xml')] if p.exists()]"
      - name: Install Build 62 source
        run: |
          cp App.js CaddieOS/App.js
          cp index.js CaddieOS/index.js
          cp compactWorkingPages.js CaddieOS/compactWorkingPages.js
          python3 scripts/build60_patch.py
          python3 scripts/build61_patch.py
          python3 scripts/build62_patch.py
      - name: Validate Build 62 source
        run: |
          grep -q "SAVE COURSE" CaddieOS/App.js
          grep -q "LIVE HOLE MAP" CaddieOS/App.js
          grep -q "CURRENT HOLE" CaddieOS/App.js
          grep -q "Hole {hole} of 18" CaddieOS/App.js
          grep -q "GET MAPPING GPS" CaddieOS/App.js
          grep -q "TAP TO TALK" CaddieOS/App.js
          grep -q "versionCode 62" CaddieOS/android/app/build.gradle
          grep -q "android.permission.RECORD_AUDIO" CaddieOS/android/app/src/main/AndroidManifest.xml
      - name: Build release APK
        working-directory: CaddieOS/android
        run: chmod +x gradlew && ./gradlew assembleRelease --no-daemon
      - name: Collect APK
        run: mkdir -p output && cp CaddieOS/android/app/build/outputs/apk/release/app-release.apk output/CaddieOS-Build-62.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CaddieOS-Build-62
          path: output/CaddieOS-Build-62.apk
          if-no-files-found: error
          retention-days: 14
