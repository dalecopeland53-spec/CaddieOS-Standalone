name: CaddieOS Build 59

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build59:
    name: Build 59 APK
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Create native shell
        run: |
          npx --yes @react-native-community/cli@latest init CaddieOS --version 0.81.6 --skip-git-init --package-name com.dalecopeland.caddieos

      - name: Install native features
        working-directory: CaddieOS
        run: |
          npm install --save @react-native-voice/voice@3.2.4 react-native-tts @react-native-community/geolocation @react-native-async-storage/async-storage react-native-safe-area-context

      - name: Repair legacy Android libraries
        working-directory: CaddieOS
        run: |
          cat > node_modules/@react-native-voice/voice/android/build.gradle <<'GRADLE'
          apply plugin: 'com.android.library'
          android {
              namespace 'com.wenkesj.voice'
              compileSdk 36
              defaultConfig { minSdk 24; targetSdk 36 }
          }
          repositories { google(); mavenCentral() }
          dependencies { implementation 'com.facebook.react:react-android' }
          GRADLE
          cat > node_modules/react-native-tts/android/build.gradle <<'GRADLE'
          apply plugin: 'com.android.library'
          android {
              namespace 'net.no_mad.tts'
              compileSdk 36
              defaultConfig { minSdk 24; targetSdk 36 }
          }
          repositories { google(); mavenCentral() }
          dependencies { implementation 'com.facebook.react:react-android' }
          GRADLE
          python3 - <<'PY'
          from pathlib import Path
          import re
          for p in [Path('node_modules/@react-native-voice/voice/android/src/main/AndroidManifest.xml'), Path('node_modules/react-native-tts/android/src/main/AndroidManifest.xml')]:
              if p.exists():
                  p.write_text(re.sub(r'\s+package="[^"]+"', '', p.read_text(), count=1))
          PY

      - name: Install Build 59 source
        run: |
          cp App.js CaddieOS/App.js
          cp index.js CaddieOS/index.js
          python3 - <<'PY'
          from pathlib import Path
          import re

          app = Path('CaddieOS/App.js')
          text = app.read_text()
          marker = 'function Header({go})'
          helpers = '''
          const Panel=({children})=><View style={s.panel}>{children}</View>;
          const Label=({text})=><Text style={s.label}>{text}</Text>;
          const Chip=({active,text,onPress})=><TouchableOpacity onPress={onPress} style={[s.chip,active&&{backgroundColor:C.gold}]}><Text style={[s.chipText,active&&{color:C.dark}]}>{text}</Text></TouchableOpacity>;
          const Mini=({text,onPress})=><TouchableOpacity onPress={onPress} style={{width:40,height:40,borderRadius:9,backgroundColor:C.navy,alignItems:'center',justifyContent:'center'}}><Text style={{fontSize:22,fontWeight:'900',color:C.white}}>{text}</Text></TouchableOpacity>;
          '''
          if 'const Panel=({children})' not in text:
              if marker not in text:
                  raise SystemExit('Build 59: Header marker missing')
              text = text.replace(marker, helpers + '\n' + marker, 1)
          app.write_text(text)

          props = Path('CaddieOS/android/gradle.properties')
          ptxt = props.read_text()
          ptxt = ptxt.replace('newArchEnabled=true', 'newArchEnabled=false')
          if 'newArchEnabled=false' not in ptxt:
              ptxt += '\nnewArchEnabled=false\n'
          props.write_text(ptxt)

          gradle = Path('CaddieOS/android/app/build.gradle')
          g = gradle.read_text()
          g = re.sub(r'versionCode\s+\d+', 'versionCode 59', g)
          g = re.sub(r'versionName\s+"[^"]+"', 'versionName "1.0.59"', g)
          gradle.write_text(g)

          manifest = Path('CaddieOS/android/app/src/main/AndroidManifest.xml')
          m = manifest.read_text()
          perms = '<uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />'
          if 'android.permission.RECORD_AUDIO' not in m:
              m = m.replace('<application', perms + '\n    <application', 1)
          manifest.write_text(m)
          PY

      - name: Validate tab crash repair
        run: |
          grep -q "const Panel=({children})" CaddieOS/App.js
          grep -q "const Label=({text})" CaddieOS/App.js
          grep -q "const Chip=({active,text,onPress})" CaddieOS/App.js
          grep -q "const Mini=({text,onPress})" CaddieOS/App.js
          grep -q "versionCode 59" CaddieOS/android/app/build.gradle
          grep -q "newArchEnabled=false" CaddieOS/android/gradle.properties

      - name: Build release APK
        working-directory: CaddieOS/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Collect Build 59 APK
        run: |
          mkdir -p output
          cp CaddieOS/android/app/build/outputs/apk/release/app-release.apk output/CaddieOS-Build-59.apk

      - name: Upload Build 59 APK
        uses: actions/upload-artifact@v4
        with:
          name: CaddieOS-Build-59
          path: output/CaddieOS-Build-59.apk
          if-no-files-found: error
          retention-days: 14
