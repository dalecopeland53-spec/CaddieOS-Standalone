name: Apply approved CaddieOS UI
on:
  push:
    paths:
      - '.github/workflows/apply-approved-ui.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply approved updates
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('App.js')
          s=p.read_text()
          def rep(a,b):
              global s
              if a not in s: raise SystemExit('Missing expected source: '+a[:100])
              s=s.replace(a,b)
          rep("const WARM=['Loosen Up','Short Wedges','Mid Irons','Long Club','Driver','Chipping','Putting','Ready'];\nconst ROUTINES=['Target','Lie','Club','Picture','Commit','Breathe','Reset','Next'];", "const ROUTINE0=['Target','Lie','Club','Picture','Commit','Breathe','Reset','Next'];")
          rep("[practiceDistance,setPracticeDistance]=useState('50'),[warmDone,setWarmDone]=useState([]),[routineDone,setRoutineDone]=useState([]);", "[practiceDistance,setPracticeDistance]=useState('50'),[warmDone,setWarmDone]=useState([]),[routineDone,setRoutineDone]=useState([]),[routineSteps,setRoutineSteps]=useState(ROUTINE0);")
          rep("[email,setEmail]=useState(''),[caddieName,setCaddieName]=useState('Pete'),[handicap,setHandicap]", "[email,setEmail]=useState(''),[handicap,setHandicap]")
          rep("x.email&&setEmail(x.email);x.caddieName&&setCaddieName(x.caddieName);x.handicap", "x.email&&setEmail(x.email);x.routineSteps&&setRoutineSteps(x.routineSteps);x.handicap")
          rep("units,player,email,caddieName,handicap,practiceDistance", "units,player,email,handicap,practiceDistance,routineSteps")
          rep("units,player,email,caddieName,handicap,practiceDistance]);", "units,player,email,handicap,practiceDistance,routineSteps]);")
          rep(" caddieName={caddieName}", "")
          rep("<More open={open} units={units} caddieName={caddieName} handicap={handicap}/>", "<More open={open} units={units} handicap={handicap}/>")
          rep("<Checklist kicker=\"PRE-ROUND\" title=\"Warm-Up\" items={WARM} done={warmDone} setDone={setWarmDone}/>", "<FlowWarmup done={warmDone} setDone={setWarmDone}/>")
          rep("<Checklist kicker=\"MENTAL GAME\" title=\"Routines\" items={ROUTINES} done={routineDone} setDone={setRoutineDone}/>", "<RoutineSetup items={routineSteps} setItems={setRoutineSteps} done={routineDone} setDone={setRoutineDone}/>")
          rep(" caddieName={caddieName} setCaddieName={setCaddieName}", "")
          rep("function Caddie({result,distance,setDistance,wind,setWind,windDir,setWindDir,elev,setElev,lie,setLie,hole,caddieName,ask", "function Caddie({result,distance,setDistance,wind,setWind,windDir,setWindDir,elev,setElev,lie,setLie,hole,ask")
          rep("{listening?'LISTENING…':`TAP AND ASK ${caddieName.toUpperCase()}`}", "{listening?'LISTENING…':'CADDIE'}")
          rep("<Text style={s.answerLabel}>{caddieName.toUpperCase()} SAYS</Text>", "<Text style={s.answerLabel}>CADDIE SAYS</Text>")
          rep("function More({open,units,caddieName,handicap}){const rows=[['Warm-Up','WARMUP','♨'],['Routines','ROUTINES','☷']", "function More({open,units,handicap}){const rows=[['Warm-Up','WARMUP','♨'],['Routine Setup','ROUTINES','☷']")
          rep("<View style={s.menuInfo}><Text style={s.menuInfoKey}>CADDIE NAME</Text><Text style={s.menuInfoVal}>{caddieName}</Text></View>", "")
          rep("function Settings({units,setUnits,player,setPlayer,email,setEmail,caddieName,setCaddieName,handicap,setHandicap,logout})", "function Settings({units,setUnits,player,setPlayer,email,setEmail,handicap,setHandicap,logout})")
          rep("<Text style={s.sectionLabel}>CADDIE NAME</Text><TextInput style={s.input} value={caddieName} onChangeText={setCaddieName}/>", "")
          rep("['WARM-UP','8-step preparation','♨','WARMUP']", "['WARM-UP','10-minute flow','♨','WARMUP']")
          rep("['ROUTINES','8-step mental game','☷','ROUTINES']", "['ROUTINE SETUP','Your 8 steps + repeat','☷','ROUTINES']")
          marker="function Checklist({kicker,title,items,done,setDone})"
          i=s.index(marker)
          insert="""function FlowWarmup({done,setDone}){const phases=[['WAKE UP THE BODY','3 MIN',[['Glute Activator','10 bodyweight squats using a club for balance.'],['Torso Twist','Club across shoulders. Rotate smoothly for 60 seconds.'],['Hip Opener','10 forward/back and 10 side-to-side leg swings each side.']]],['BUILD THE FEEL','4 MIN',[['Heavy Swing','Two wedges together. 5 slow continuous swings.'],['Half-Wedge Drill','5 hip-to-hip wedge shots. Focus on solid contact.'],['Ladder Climber','2–3 balls each: Wedge → 8 Iron → 5 Iron/Hybrid → Driver.']]],['CALIBRATE THE TOUCH','3 MIN',[['Fringe Roll','Two long putts to the fringe to learn today’s green speed.'],['3-Foot Circle','Hole three short putts from about one putter length.']]]];const toggle=x=>setDone(done.includes(x)?done.filter(v=>v!==x):[...done,x]);return <><PageHead kicker=\"PRE-ROUND\" title=\"10-Minute Flow\" badge={`${done.length}/8`}/>{phases.map(([phase,time,items])=><View key={phase} style={s.flowPhase}><View style={s.flowHead}><Text style={s.flowTitle}>{phase}</Text><Text style={s.flowTime}>{time}</Text></View>{items.map(([name,tip])=><TouchableOpacity key={name} style={s.flowRow} onPress={()=>toggle(name)}><View style={[s.checkBox,done.includes(name)&&s.checkOn]}><Text style={s.checkMark}>{done.includes(name)?'✓':'•'}</Text></View><View style={s.flex}><Text style={s.checkText}>{name}</Text><Text style={s.flowTip}>{tip}</Text></View></TouchableOpacity>)}</View>)}<TouchableOpacity style={s.goldButton} onPress={()=>setDone(phases.flatMap(x=>x[2].map(y=>y[0])))}><Text style={s.goldButtonText}>READY TO PLAY</Text></TouchableOpacity></>}
function RoutineSetup({items,setItems,done,setDone}){const toggle=i=>setDone(done.includes(i)?done.filter(v=>v!==i):[...done,i]);const edit=(i,v)=>setItems(items.map((x,j)=>j===i?v:x));return <><PageHead kicker=\"MENTAL GAME\" title=\"Routine Setup\" badge={`${done.length}/9`}/><View style={s.menuPanel}>{items.map((x,i)=><View key={i} style={s.checkRow}><TouchableOpacity onPress={()=>toggle(i)}><View style={[s.checkBox,done.includes(i)&&s.checkOn]}><Text style={s.checkMark}>{done.includes(i)?'✓':i+1}</Text></View></TouchableOpacity><TextInput style={s.routineInput} value={x} onChangeText={v=>edit(i,v)} placeholder={`Step ${i+1}`} placeholderTextColor={C.muted}/></View>)}<TouchableOpacity style={s.repeatRow} onPress={()=>toggle(8)}><Text style={s.repeatNum}>9</Text><Text style={s.repeatText}>REPEAT</Text></TouchableOpacity></View></>}
"""
          s=s[:i]+insert+s[i:]
          rep("safe:{flex:1,backgroundColor:C.bg}", "safe:{flex:1,backgroundColor:C.bg,paddingTop:Platform.OS==='android'?StatusBar.currentHeight:0}")
          rep("paddingBottom:Platform.OS==='android'?16:7", "paddingBottom:Platform.OS==='android'?28:7")
          rep("paddingBottom:Platform.OS==='android'?14:5", "paddingBottom:Platform.OS==='android'?26:5")
          rep("goldOutlineText:{fontSize:11,fontWeight:'900',color:C.gold2}", "goldOutlineText:{fontSize:12,fontWeight:'900',color:C.white}")
          rep("bagStepText:{", "bagStepText:{textAlign:'center',textAlignVertical:'center',")
          # Add new styles before final StyleSheet close.
          end=s.rfind('});')
          extra=",\n flowPhase:{backgroundColor:C.panel,borderWidth:1,borderColor:C.line,borderRadius:13,marginBottom:8,overflow:'hidden'},flowHead:{flexDirection:'row',justifyContent:'space-between',alignItems:'center',backgroundColor:C.panel2,paddingHorizontal:11,paddingVertical:8},flowTitle:{fontSize:11,fontWeight:'900',letterSpacing:1.1,color:C.navy},flowTime:{fontSize:10,fontWeight:'900',color:C.gold},flowRow:{flexDirection:'row',alignItems:'center',paddingHorizontal:10,paddingVertical:7,borderTopWidth:1,borderTopColor:C.line},flowTip:{fontSize:9.5,lineHeight:13,color:C.muted,fontWeight:'600',marginTop:1},routineInput:{flex:1,minHeight:38,fontSize:15,fontWeight:'800',color:C.navy,paddingHorizontal:8,paddingVertical:4},repeatRow:{minHeight:58,backgroundColor:C.gold2,borderRadius:10,margin:8,flexDirection:'row',alignItems:'center',justifyContent:'center',borderWidth:1,borderColor:'#FFE39C'},repeatNum:{position:'absolute',left:16,fontSize:18,fontWeight:'900',color:C.dark},repeatText:{fontSize:22,fontWeight:'900',letterSpacing:2,color:C.dark}"
          s=s[:end]+extra+s[end:]
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add App.js
          git commit -m "Build approved warm-up routine and UI fixes"
          git push
