name: Apply Approved UI
on:
  push:
    paths:
      - scripts/apply_approved_ui.py
      - .github/workflows/apply-approved-ui.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/apply_approved_ui.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add App.js
          git diff --cached --quiet || git commit -m "Build approved CaddieOS updates"
          git push
