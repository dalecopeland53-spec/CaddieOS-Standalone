name: Repair OpenGolfAPI Runner Matcher

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-opengolf-runner-v2.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair matcher line
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/apply-opengolf-directory-now.yml')
          lines=p.read_text().splitlines()
          changed=False
          for i,line in enumerate(lines):
              if 'nt,n=re.subn' in line:
                  indent=line[:len(line)-len(line.lstrip())]
                  lines[i]=indent+'''nt,n=re.subn(r"function Course\\([^)]*\\)\\{.*?\\nfunction More",course+'\\nfunction More',t,count=1,flags=re.S)'''
                  changed=True
          if not changed:
              raise SystemExit('Matcher line not found')
          p.write_text('\n'.join(lines)+'\n')
          PY
      - name: Commit runner repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/apply-opengolf-directory-now.yml
          git commit -m "Repair OpenGolfAPI runner matcher"
          git push
