name: Talking Caddie Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Talking Caddie
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.20.2

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Create clean native React Native shell
        run: |
          npx --yes @react-native-community/cli@latest init TalkingCaddie --version 0.83.2 --skip-git-init --package-name com.dalecopeland.talkingcaddie

      - name: Install Talking Caddie app code
        run: |
          cp App.js TalkingCaddie/App.js
          python3 - <<'PY'
          from pathlib import Path
          p=Path('TalkingCaddie/android/app/src/main/res/values/strings.xml')
          t=p.read_text()
          t=t.replace('<string name="app_name">TalkingCaddie</string>','<string name="app_name">Talking Caddie</string>')
          p.write_text(t)
          PY

      - name: Build standalone release APK
        working-directory: TalkingCaddie/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Collect Talking Caddie APK
        run: |
          mkdir -p output
          cp TalkingCaddie/android/app/build/outputs/apk/release/app-release.apk output/Talking-Caddie.apk

      - name: Upload Talking Caddie APK
        uses: actions/upload-artifact@v4
        with:
          name: Talking-Caddie-Android
          path: output/Talking-Caddie.apk
          if-no-files-found: error
