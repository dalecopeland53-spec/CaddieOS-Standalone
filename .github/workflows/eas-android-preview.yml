name: CaddieOS Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build CaddieOS APK
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout CaddieOS
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.20.2

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Create clean React Native shell
        run: |
          npx --yes @react-native-community/cli@latest init CaddieOS --version 0.83.2 --skip-git-init --package-name com.dalecopeland.caddieos

      - name: Install native CaddieOS features
        working-directory: CaddieOS
        run: |
          npm install --save @react-native-voice/voice react-native-tts @react-native-community/geolocation @react-native-async-storage/async-storage

      - name: Install CaddieOS source and Android permissions
        run: |
          cp App.js CaddieOS/App.js
          if [ -f index.js ]; then cp index.js CaddieOS/index.js; fi

          python3 - <<'PY'
          from pathlib import Path

          manifest = Path('CaddieOS/android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text()
          perms = '''<uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />'''
          if 'android.permission.RECORD_AUDIO' not in text:
              text = text.replace('<application', perms + '\n    <application', 1)
          manifest.write_text(text)

          strings = Path('CaddieOS/android/app/src/main/res/values/strings.xml')
          text = strings.read_text()
          if '<string name="app_name">' in text:
              import re
              text = re.sub(r'<string name="app_name">.*?</string>', '<string name="app_name">CaddieOS</string>', text)
          strings.write_text(text)
          PY

      - name: Validate JavaScript entry files
        run: |
          test -s CaddieOS/App.js
          test -s CaddieOS/index.js
          grep -q "@react-native-voice/voice" CaddieOS/App.js
          grep -q "Wind Guide" CaddieOS/App.js

      - name: Build release APK
        working-directory: CaddieOS/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Collect APK
        run: |
          mkdir -p output
          cp CaddieOS/android/app/build/outputs/apk/release/app-release.apk output/CaddieOS.apk

      - name: Upload CaddieOS APK
        uses: actions/upload-artifact@v4
        with:
          name: CaddieOS-Android
          path: output/CaddieOS.apk
          if-no-files-found: error
          retention-days: 14
