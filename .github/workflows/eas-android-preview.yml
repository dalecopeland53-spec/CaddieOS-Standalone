name: CaddieOS Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build CaddieOS APK
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout CaddieOS
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.20.2

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Create clean React Native shell
        run: |
          npx --yes @react-native-community/cli@latest init CaddieOS --version 0.83.2 --skip-git-init --package-name com.dalecopeland.caddieos

      - name: Install and modernize native CaddieOS features
        working-directory: CaddieOS
        run: |
          npm install --save @react-native-voice/voice@3.2.4 react-native-tts @react-native-community/geolocation @react-native-async-storage/async-storage

          cat > node_modules/@react-native-voice/voice/android/build.gradle <<'GRADLE'
          apply plugin: 'com.android.library'
          android {
              namespace 'com.wenkesj.voice'
              compileSdk 36
              defaultConfig { minSdk 24; targetSdk 36 }
          }
          repositories { google(); mavenCentral() }
          dependencies { implementation 'com.facebook.react:react-android' }
          GRADLE

          cat > node_modules/react-native-tts/android/build.gradle <<'GRADLE'
          apply plugin: 'com.android.library'
          android {
              namespace 'net.no_mad.tts'
              compileSdk 36
              defaultConfig { minSdk 24; targetSdk 36 }
          }
          repositories { google(); mavenCentral() }
          dependencies { implementation 'com.facebook.react:react-android' }
          GRADLE

          python3 - <<'PY'
          from pathlib import Path
          import re
          for p in [Path('node_modules/@react-native-voice/voice/android/src/main/AndroidManifest.xml'), Path('node_modules/react-native-tts/android/src/main/AndroidManifest.xml')]:
              if p.exists():
                  p.write_text(re.sub(r'\s+package="[^"]+"', '', p.read_text(), count=1))
          PY

      - name: Install CaddieOS source and Android permissions
        run: |
          cp App.js CaddieOS/App.js
          if [ -f index.js ]; then cp index.js CaddieOS/index.js; fi
          if [ -f compactWorkingPages.js ]; then cp compactWorkingPages.js CaddieOS/compactWorkingPages.js; fi
          python3 - <<'PY'
          from pathlib import Path
          import re
          manifest = Path('CaddieOS/android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text()
          perms = '''<uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />'''
          if 'android.permission.RECORD_AUDIO' not in text:
              text = text.replace('<application', perms + '\n    <application', 1)
          manifest.write_text(text)
          strings = Path('CaddieOS/android/app/src/main/res/values/strings.xml')
          text = strings.read_text()
          text = re.sub(r'<string name="app_name">.*?</string>', '<string name="app_name">CaddieOS</string>', text)
          strings.write_text(text)
          PY

      - name: Validate JavaScript entry files
        run: |
          test -s CaddieOS/App.js
          test -s CaddieOS/index.js
          test -s CaddieOS/compactWorkingPages.js
          grep -q "@react-native-voice/voice" CaddieOS/App.js
          grep -q "CaddieOS" CaddieOS/App.js

      - name: Validate modernized Android dependencies
        run: |
          ! grep -R "jcenter()" CaddieOS/node_modules/@react-native-voice/voice/android CaddieOS/node_modules/react-native-tts/android
          grep -q "compileSdk 36" CaddieOS/node_modules/@react-native-voice/voice/android/build.gradle
          grep -q "compileSdk 36" CaddieOS/node_modules/react-native-tts/android/build.gradle

      - name: Build release APK
        working-directory: CaddieOS/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Collect APK
        run: |
          mkdir -p output
          cp CaddieOS/android/app/build/outputs/apk/release/app-release.apk output/CaddieOS.apk

      - name: Upload CaddieOS APK
        uses: actions/upload-artifact@v4
        with:
          name: CaddieOS-Android
          path: output/CaddieOS.apk
          if-no-files-found: error
          retention-days: 14

# Rebuild trigger: Android system-bar safe-area fix
