name: Apply final approved CaddieOS UI
on:
  push:
    paths:
      - '.github/workflows/apply-final-approved-ui.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch approved UI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('App.js')
          s=p.read_text()

          # constants
          s=s.replace("const WARM=['Loosen Up','Short Wedges','Mid Irons','Long Club','Driver','Chipping','Putting','Ready'];\nconst ROUTINES=['Target','Lie','Club','Picture','Commit','Breathe','Reset','Next'];", "const ROUTINE0=['Target','Lie','Club','Picture','Commit','Breathe','Reset','Next'];")

          # state
          s=s.replace("[practiceDistance,setPracticeDistance]=useState('50'),[warmDone,setWarmDone]=useState([]),[routineDone,setRoutineDone]=useState([]);", "[practiceDistance,setPracticeDistance]=useState('50'),[warmDone,setWarmDone]=useState([]),[routineDone,setRoutineDone]=useState([]),[routineSteps,setRoutineSteps]=useState(ROUTINE0);")
          s=s.replace("[email,setEmail]=useState(''),[caddieName,setCaddieName]=useState('Pete'),[handicap,setHandicap]", "[email,setEmail]=useState(''),[handicap,setHandicap]")
          s=s.replace("x.email&&setEmail(x.email);x.caddieName&&setCaddieName(x.caddieName);x.handicap", "x.email&&setEmail(x.email);x.routineSteps&&setRoutineSteps(x.routineSteps);x.handicap")
          s=s.replace("units,player,email,caddieName,handicap,practiceDistance", "units,player,email,handicap,practiceDistance,routineSteps")
          s=s.replace("units,player,email,caddieName,handicap,practiceDistance]);", "units,player,email,handicap,practiceDistance,routineSteps]);")

          # page props
          s=s.replace(" caddieName={caddieName}", "")
          s=s.replace("<More open={open} units={units} caddieName={caddieName} handicap={handicap}/>", "<More open={open} units={units} handicap={handicap}/>")
          s=s.replace(" caddieName={caddieName} setCaddieName={setCaddieName}", "")
          s=s.replace("{page==='WARMUP'&&<Checklist kicker=\"PRE-ROUND\" title=\"Warm-Up\" items={WARM} done={warmDone} setDone={setWarmDone}/>} ", "{page==='WARMUP'&&<FlowWarmup done={warmDone} setDone={setWarmDone}/>} ")
          s=s.replace("{page==='ROUTINES'&&<Checklist kicker=\"MENTAL GAME\" title=\"Routines\" items={ROUTINES} done={routineDone} setDone={setRoutineDone}/>} ", "{page==='ROUTINES'&&<RoutineSetup items={routineSteps} setItems={setRoutineSteps} done={routineDone} setDone={setRoutineDone}/>} ")

          # Caddie names removed
          s=s.replace("function Caddie({result,distance,setDistance,wind,setWind,windDir,setWindDir,elev,setElev,lie,setLie,hole,caddieName,ask", "function Caddie({result,distance,setDistance,wind,setWind,windDir,setWindDir,elev,setElev,lie,setLie,hole,ask")
          s=s.replace("{listening?'LISTENING…':`TAP AND ASK ${caddieName.toUpperCase()}`}", "{listening?'LISTENING…':'CADDIE'}")
          s=s.replace("<Text style={s.answerLabel}>{caddieName.toUpperCase()} SAYS</Text>", "<Text style={s.answerLabel}>CADDIE SAYS</Text>")

          # More and Settings
          s=s.replace("function More({open,units,caddieName,handicap}){const rows=[['Warm-Up','WARMUP','♨'],['Routines','ROUTINES','☷']", "function More({open,units,handicap}){const rows=[['Warm-Up','WARMUP','♨'],['Routine Setup','ROUTINES','☷']")
          s=s.replace("<View style={s.menuInfo}><Text style={s.menuInfoKey}>CADDIE NAME</Text><Text style={s.menuInfoVal}>{caddieName}</Text></View>", "")
          s=s.replace("function Settings({units,setUnits,player,setPlayer,email,setEmail,caddieName,setCaddieName,handicap,setHandicap,logout})", "function Settings({units,setUnits,player,setPlayer,email,setEmail,handicap,setHandicap,logout})")
          s=s.replace("<Text style={s.sectionLabel}>CADDIE NAME</Text><TextInput style={s.input} value={caddieName} onChangeText={setCaddieName}/>", "")

          # Home labels
          s=s.replace("['WARM-UP','8-step preparation','♨','WARMUP']", "['WARM-UP','10-minute flow','♨','WARMUP']")
          s=s.replace("['ROUTINES','8-step mental game','☷','ROUTINES']", "['ROUTINE SETUP','8 steps + repeat','☷','ROUTINES']")

          # Insert new components before Checklist
          marker="function Checklist({kicker,title,items,done,setDone})"
          if marker in s and 'function FlowWarmup(' not in s:
              i=s.index(marker)
              insert="""function FlowWarmup({done,setDone}){const phases=[['WAKE UP THE BODY','3 MIN',[['Glute Activator','10 bodyweight squats using a club for balance.'],['Torso Twist','Club across shoulders. Rotate smoothly for 60 seconds.'],['Hip Opener','10 forward/back and 10 side-to-side leg swings each side.']]],['BUILD THE FEEL','4 MIN',[['Heavy Swing','Two wedges together. 5 slow continuous swings.'],['Half-Wedge Drill','5 hip-to-hip wedge shots. Focus on solid contact.'],['Ladder Climber','2–3 balls each: Wedge → 8 Iron → 5 Iron/Hybrid → Driver.']]],['CALIBRATE THE TOUCH','3 MIN',[['Fringe Roll','Two long putts to the fringe to learn today’s green speed.'],['3-Foot Circle','Hole three short putts from about one putter length.']]]];const all=phases.flatMap(x=>x[2].map(y=>y[0]));const toggle=x=>setDone(done.includes(x)?done.filter(v=>v!==x):[...done,x]);return <><PageHead kicker=\"PRE-ROUND\" title=\"10-Minute Flow\" badge={`${done.length}/8`}/>{phases.map(([phase,time,items])=><View key={phase} style={s.flowPhase}><View style={s.flowHead}><Text style={s.flowTitle}>{phase}</Text><Text style={s.flowTime}>{time}</Text></View>{items.map(([name,tip])=><TouchableOpacity key={name} style={s.flowRow} onPress={()=>toggle(name)}><View style={[s.checkBox,done.includes(name)&&s.checkOn]}><Text style={s.checkMark}>{done.includes(name)?'✓':'•'}</Text></View><View style={s.flex}><Text style={s.checkText}>{name}</Text><Text style={s.flowTip}>{tip}</Text></View></TouchableOpacity>)}</View>)}<TouchableOpacity style={s.goldButton} onPress={()=>setDone(all)}><Text style={s.goldButtonText}>READY TO PLAY</Text></TouchableOpacity></>}
function RoutineSetup({items,setItems,done,setDone}){const toggle=i=>setDone(done.includes(i)?done.filter(v=>v!==i):[...done,i]);const edit=(i,v)=>setItems(items.map((x,j)=>j===i?v:x));return <><PageHead kicker=\"MENTAL GAME\" title=\"Routine Setup\" badge={`${done.length}/9`}/><View style={s.menuPanel}>{items.map((x,i)=><View key={i} style={s.checkRow}><TouchableOpacity onPress={()=>toggle(i)}><View style={[s.checkBox,done.includes(i)&&s.checkOn]}><Text style={s.checkMark}>{done.includes(i)?'✓':i+1}</Text></View></TouchableOpacity><TextInput style={s.routineInput} value={x} onChangeText={v=>edit(i,v)} placeholder={`Step ${i+1}`} placeholderTextColor={C.muted}/></View>)}<TouchableOpacity style={s.repeatRow} onPress={()=>toggle(8)}><View style={s.repeatNumBox}><Text style={s.repeatNum}>9</Text></View><Text style={s.repeatText}>REPEAT</Text></TouchableOpacity></View></>}
"""
              s=s[:i]+insert+s[i:]

          # contrast + alignment
          s=s.replace("goldOutlineText:{fontSize:11,fontWeight:'900',color:C.gold2}", "goldOutlineText:{fontSize:12,fontWeight:'900',color:C.white}")
          s=s.replace("bagStepText:{fontSize:18,fontWeight:'900',color:C.white}", "bagStepText:{fontSize:18,fontWeight:'900',color:C.white,textAlign:'center',textAlignVertical:'center',includeFontPadding:false}")

          # styles for new pages
          if 'flowPhase:{' not in s:
              end=s.rfind('});')
              extra=",\n flowPhase:{backgroundColor:C.panel,borderWidth:1,borderColor:C.line,borderRadius:13,marginBottom:8,overflow:'hidden'},flowHead:{flexDirection:'row',justifyContent:'space-between',alignItems:'center',backgroundColor:C.panel2,paddingHorizontal:11,paddingVertical:8},flowTitle:{fontSize:11,fontWeight:'900',letterSpacing:1.1,color:C.navy},flowTime:{fontSize:10,fontWeight:'900',color:C.gold},flowRow:{flexDirection:'row',alignItems:'center',paddingHorizontal:10,paddingVertical:7,borderTopWidth:1,borderTopColor:C.line},flowTip:{fontSize:9.5,lineHeight:13,color:C.muted,fontWeight:'600',marginTop:1},routineInput:{flex:1,minHeight:38,fontSize:15,fontWeight:'800',color:C.navy,paddingHorizontal:8,paddingVertical:4},repeatRow:{minHeight:62,backgroundColor:C.gold2,borderRadius:10,margin:8,flexDirection:'row',alignItems:'center',justifyContent:'center',borderWidth:1,borderColor:'#FFE39C'},repeatNumBox:{position:'absolute',left:10,width:42,height:42,borderRadius:9,backgroundColor:C.navy,alignItems:'center',justifyContent:'center'},repeatNum:{fontSize:18,fontWeight:'900',color:C.gold2},repeatText:{fontSize:24,fontWeight:'900',letterSpacing:2,color:C.dark}"
              s=s[:end]+extra+s[end:]

          # ensure main app shell stays inside Android system bars
          s=re.sub(r"safe:\{flex:1,backgroundColor:C\.bg(?:,paddingTop:[^}]*)?\}", "safe:{flex:1,backgroundColor:C.bg,paddingTop:Platform.OS==='android'?(StatusBar.currentHeight||24):0}", s, count=1)
          s=s.replace("paddingBottom:Platform.OS==='android'?16:7", "paddingBottom:Platform.OS==='android'?38:7")
          s=s.replace("paddingBottom:Platform.OS==='android'?14:5", "paddingBottom:Platform.OS==='android'?36:5")

          p.write_text(s)
          PY
      - name: Validate final UI
        run: |
          grep -q "title=\"10-Minute Flow\"" App.js
          grep -q "title=\"Routine Setup\"" App.js
          grep -q ">CADDIE SAYS<" App.js
          grep -q "'CADDIE'}" App.js
          ! grep -q "TAP AND ASK PETE" App.js
          ! grep -q "PETE SAYS" App.js
      - name: Commit final UI
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add App.js
          git commit -m "Apply approved CaddieOS screens and safe areas"
          git push
